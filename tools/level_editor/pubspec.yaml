name: level_editor
description: "ColorVerse Level Authoring Tool — create and edit level data"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management (same version as game)
  flutter_riverpod: ^2.6.1

  # Image processing (pure Dart, no native dependencies)
  image: ^4.5.2

  # Native file dialogs
  file_picker: ^8.1.7

  # Shared game models
  colorverse:
    path: ../../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
